<title>Qottuf BD Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: a navy rail of sections beside a light work surface; every view leads with what needs a decision. */
:root {
  --ground: #F5F6F8; --surface: #FFFFFF; --surface-2: #ECEEF3; --ink: #0D2B5C; --ink-2: #3F4560; --muted: #5C6278; --line: #D8DCE5;
  --rail: #0D2B5C; --rail-ink: #FFFFFF; --rail-muted: #BDC3D0; --rail-hover: #1A3A70;
  --accent: #7EB5A8; --accent-ink: #3A7C6E;
  --ok: #2F6E61; --ok-bg: #E2F0EC; --warn: #8A5A00; --warn-bg: #FFF2CF; --bad: #A61B12; --bad-bg: #FBE7E5; --info-bg: #E6ECF6;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --font-ar: "Noto Naskh Arabic", "DM Sans", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 4px; --r-md: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0A2049; --surface: #0D2B5C; --surface-2: #14376F; --ink: #FFFFFF; --ink-2: #D8DCE5; --muted: #BDC3D0; --line: #26487E;
    --rail: #071837; --rail-ink: #FFFFFF; --rail-muted: #9BA3B5; --rail-hover: #14376F;
    --accent: #7EB5A8; --accent-ink: #A8CFC6;
    --ok: #A8CFC6; --ok-bg: #173F3A; --warn: #F2C46D; --warn-bg: #3F3210; --bad: #F4A3A0; --bad-bg: #45201F; --info-bg: #183A70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0A2049; --surface: #0D2B5C; --surface-2: #14376F; --ink: #FFFFFF; --ink-2: #D8DCE5; --muted: #BDC3D0; --line: #26487E;
  --rail: #071837; --rail-ink: #FFFFFF; --rail-muted: #9BA3B5; --rail-hover: #14376F;
  --accent: #7EB5A8; --accent-ink: #A8CFC6;
  --ok: #A8CFC6; --ok-bg: #173F3A; --warn: #F2C46D; --warn-bg: #3F3210; --bad: #F4A3A0; --bad-bg: #45201F; --info-bg: #183A70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--rail); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; background: var(--rail); color: var(--rail-ink);
  padding-block: 22px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
.brand { display: grid; gap: 2px; }
.brand .who { font: 600 22px/1.1 var(--font-display); letter-spacing: .01em; }
.brand .what { font: 600 10px/1.4 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--rail-muted); }
.nav { display: grid; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--rail-muted); font-weight: 500; }
.nav button:hover { background: var(--rail-hover); color: var(--rail-ink); }
.nav button[aria-current="page"] { color: var(--rail-ink); background: var(--rail-hover); }
.nav button[aria-current="page"]::before { background: var(--accent); }
.nav button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: transparent; flex: none; }
.nav .count { margin-left: auto; font: 600 11px/1 var(--font-body); background: var(--accent); color: #0D2B5C; border-radius: 999px; padding: 3px 7px; font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12.5px; color: var(--rail-muted); }
.rail-foot .row { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--rail-muted); }
.dot.on { background: var(--accent); }
.dot.off { background: #E07B73; }

main { min-width: 0; padding-block: 26px 72px; padding-left: max(16px, 28px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; display: grid; gap: 28px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.page-head h1 { margin: 0; font: 500 32px/1.1 var(--font-display); text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.banner { border: 1px solid var(--line); background: var(--info-bg); border-radius: var(--r-md); padding: 10px 14px; font-size: 14px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

section > h2, .h2 { margin: 0 0 10px; font: 700 11px/1.3 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h3 { margin: 0; font: 600 16px/1.35 var(--font-body); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.panel-pad { padding: 16px 18px; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.stack { display: grid; gap: 10px; align-content: start; }
/* Grid and flex children default to their content's width; a wide table or a long record would push the page sideways. */
.wrap > *, .grid > *, .stack > *, form > *, .fields > * { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.ar { font-family: var(--font-ar); line-height: 1.8; direction: rtl; text-align: right; }
.empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.accent::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.btn { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px;
  padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.linkish { all: unset; cursor: pointer; color: var(--accent-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th { text-align: left; font: 700 10.5px/1.3 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--info-bg); }

form { display: grid; gap: 12px; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
label.f > input, label.f > select, label.f > textarea { display: block; margin-top: 5px; }
label.f span.hint { font-weight: 400; color: var(--muted); }
bdi.ar-run { font-family: var(--font-ar); }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: 14px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
textarea.tall { min-height: 170px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; }
legend { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 4px; }
.check-inline { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; }
.form-error { color: var(--bad); font-size: 13.5px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.decision { display: grid; gap: 10px; border-left: 3px solid var(--accent); }
.finding { border-left: 3px solid var(--line); padding: 8px 12px; background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; display: grid; gap: 3px; font-size: 14px; }
.finding.fail { border-left-color: var(--bad); }
.finding.signal { border-left-color: var(--warn); }
.finding .rule { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.finding q { quotes: "\201C" "\201D"; overflow-wrap: anywhere; }

.meter { display: flex; gap: 6px; }
.meter i { flex: 1; height: 8px; border-radius: 2px; background: var(--surface-2); }
.meter i.on { background: var(--accent); }
.big { font: 600 34px/1 var(--font-body); font-variant-numeric: tabular-nums; }

/* The band ruler: SAR 0 to 150 m, the 20-100 m band shaded, the opportunity's range drawn on it. */
.ruler { position: relative; height: 26px; margin-top: 4px; }
.ruler .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--surface-2); border-radius: 2px; }
.ruler .band { position: absolute; top: 9px; height: 8px; background: var(--ok-bg); border: 1px solid var(--ok); border-radius: 2px; }
.ruler .val { position: absolute; top: 6px; height: 14px; background: var(--ink); border-radius: 2px; min-width: 3px; }
.ruler .tick { position: absolute; top: 20px; font-size: 10px; color: var(--muted); transform: translateX(-50%); }

.agents { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.agent { all: unset; cursor: pointer; display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.agent[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.agent .name { font-weight: 700; }
.agent .desc { font-size: 13.5px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 14px; }
.steps .s { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--muted); }
.steps .s.running { border-color: var(--accent); border-right-color: transparent; animation: spin 1s linear infinite; }
.steps .s.done { background: var(--ok); border-color: var(--ok); }
.steps .s.blocked { background: var(--warn); border-color: var(--warn); }
.steps .s.failed { background: var(--bad); border-color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }

.doc { display: grid; gap: 8px; font-size: 15px; }
.doc h3 { font: 600 20px/1.25 var(--font-display); }
.doc h4 { margin: 6px 0 0; font: 700 11px/1.3 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.doc ul { margin: 0; padding-left: 20px; }
.doc p { margin: 0; }
.doc.ar ul { padding-left: 0; padding-right: 20px; }

#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; gap: 8px; }
#toast div { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--r-sm); font-size: 14px; max-width: 360px; box-shadow: 0 4px 16px rgba(13, 43, 92, .2); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; align-items: center; gap: 14px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .brand .what, .rail-foot { display: none; }
  .brand .who { font-size: 18px; white-space: nowrap; }
  .nav { display: flex; gap: 2px; }
  .nav button { white-space: nowrap; padding: 6px 8px; }
  main { padding-block: 18px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .page-head h1 { font-size: 26px; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="who">Qottuf Aljazeera</span><span class="what">Business Development</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot" id="status"></div>
  </aside>
  <main><div class="wrap" id="view"><p class="empty">Loading the console…</p></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="qottuf-console.js"></script>
<script>
(() => {
"use strict";
const Q = window.QottufConsole;
const view = document.getElementById("view");
const VIEWS = [["board", "Board"], ["pipeline", "Pipeline"], ["agents", "Agents"], ["approvals", "Approvals"], ["proof", "Proof"], ["lifts", "Lifts"], ["footprint", "Footprint"], ["check", "Check text"]];
const ROLES = ["asil", "bid_coordinator", "desk_lead", "technical_office", "estimator", "maintenance_supervisor"];
// evidence is written by the owner only (db rules); the team files into evidence_drafts and Asil approves (S-G5).
// decisions is owner-only too: artifact approvals by artifact id, bid decisions (S-G1) as bid-<opportunity id>.
const COLS = ["opps", "accounts", "evidence", "evidence_drafts", "queue", "decisions", "units", "listings", "checks", "entity", "runs"];
const S = {
  view: "board", brand: null, rules: null, rulesVersion: "", bootError: null,
  sample: null, sampleState: "connecting", db: null, dbState: "connecting", stale: false, readOnly: false,
  me: { isOwner: false, canEdit: false, canWrite: null, id: null },
  data: { opps: [], accounts: [], contacts: [], evidence: [], evidence_drafts: [], queue: [], decisions: {}, units: [], listings: [], checks: {}, entity: null, runs: [] },
  loaded: new Set(),
  ui: { pipeFilter: "all", showClosed: false, selOpp: null, newOpp: false, selArt: null, artFilter: "waiting", agent: "meeting_brief",
        evProject: "all", addEvidence: false, selUnit: null, addUnit: false, open: {}, checkResult: null, siteResult: null, editEntity: false },
  drafts: {}, run: null, errors: {},
};

// ------------------------------------------------------------------ helpers
const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const chip = (text, tone = "") => `<span class="chip ${tone}">${h(text)}</span>`;
const clean = (x) => JSON.parse(JSON.stringify(x));
const hasArabic = (s) => /[\u0600-\u06FF]/.test(s || "");
// Escape, then isolate each Arabic run inside English text so the bidi algorithm can't reorder the punctuation around it.
const bidi = (s) => h(s).replace(/[\u0600-\u06FF](?:[\u0600-\u06FF\s.\u060C]*[\u0600-\u06FF.])?/g, (m) => `<bdi class="ar-run" lang="ar">${m}</bdi>`);
const TZ = "Asia/Riyadh";
const fmtDate = (iso) => iso ? new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: TZ }).format(new Date(iso.length === 10 ? iso + "T12:00:00+03:00" : iso)) : "";
const fmtDateTime = (iso) => iso ? new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(new Date(iso)) : "";
const sarM = (n) => n == null ? "" : `${(n / 1e6).toLocaleString("en-US", { maximumFractionDigits: 1 })} m`;
const band = (o) => o.value_min_sar == null && o.value_max_sar == null ? "value unknown" : `SAR ${sarM(o.value_min_sar ?? o.value_max_sar)}${o.value_max_sar != null && o.value_max_sar !== o.value_min_sar ? `–${sarM(o.value_max_sar)}` : ""}`;
const today = () => Q.riyadhDate(new Date());
const hoursLeft = (iso) => Math.round((new Date(iso).getTime() - Date.now()) / 3600000);
const dueText = (iso) => { const hl = hoursLeft(iso); if (hl < 0) return `overdue ${hl > -48 ? -hl + " h" : Math.round(-hl / 24) + " days"}`; return hl < 48 ? `in ${hl} h` : `in ${Math.round(hl / 24)} days`; };
const daysTo = (date) => Math.round((Date.parse(date) - Date.parse(today())) / 86400000);
const newId = (p) => `${p}-${Date.now().toString(36).toUpperCase().slice(-5)}${Math.random().toString(36).slice(2, 4).toUpperCase()}`;
const localInput = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
const fromLocal = (v) => v ? new Date(v).toISOString() : "";
const byId = (list, id) => list.find((x) => (x.id ?? x._id) === id);
const accountName = (id) => byId(S.data.accounts, id)?.name_en ?? "";
// Only full phone numbers stay in text as public: a short code such as "966" would let any number ending in it through.
const publicNumbers = () => (S.brand?.verified_figures ?? []).filter((f) => f.id === "contact" && String(f.value).replace(/\D/g, "").length >= 7).map((f) => String(f.value));
const STAGE_TONE = { won: "ok", lost: "bad", no_bid: "", withdrawn: "", cancelled: "", screened: "warn", go: "accent" };
const stageChip = (s) => chip(s.replace("_", " "), STAGE_TONE[s] ?? "");
const koTone = (s) => s === "pass" ? "ok" : s === "fail" ? "bad" : "warn";

function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  document.getElementById("toast").append(t);
  setTimeout(() => t.remove(), 4200);
}

function dv(form, name, fallback = "") {
  const d = S.drafts[form];
  return d && name in d ? d[name] : fallback;
}

function errorCopy(e) {
  if (!e) return "Something went wrong.";
  if (Q && e instanceof Q.RuleError) return e.message;
  if (Q && e instanceof Q.ModelCancelledError) return "Stopped.";
  if (Q && e instanceof Q.ModelUnavailableError) return /not_granted/.test(e.message)
    ? "Claude was not allowed for this page. Reload it and allow Claude when asked to run agents."
    : "Claude isn't available in this view. Open the console in Claude while signed in.";
  if (Q && e instanceof Q.ModelTransientError) return "Claude is busy, or your plan's usage limit was reached. Try again in a few minutes.";
  if (Q && e instanceof Q.ModelRefusalError) return "Claude declined this request. Change the input and try again.";
  if (Q && (e instanceof Q.ModelOutputError || e instanceof Q.ModelTruncatedError)) return "Claude's answer didn't come back in the expected shape. Try again; if it repeats, shorten the input.";
  if (e.issues) return e.issues.map((i) => `${i.path.join(".") || "input"}: ${i.message}`).join("; ");
  if (e.code === "invalid_argument") return "You can't change the console's data from this view.";
  if (e.code === "quota_exceeded") return "The console's storage is full. Delete old drafts or runs, then try again.";
  return e.message || String(e.code || e);
}

// ------------------------------------------------------------------ data access
function approvedEvidence({ maxTier = "tender", projectRef } = {}) {
  const t = today();
  return S.data.evidence
    .filter((e) => e.status === "approved" && (!e.expires_at || e.expires_at >= t) && Q.TIER_RANK[e.tier] <= Q.TIER_RANK[maxTier] && (!projectRef || e.project_ref === projectRef))
    .map(toRecord);
}
function toRecord(e) {
  return { id: e._id, type: e.type, tier: e.tier, project_ref: e.project_ref ?? null, title: e.title, issuer: e.issuer ?? null, issued_at: e.issued_at ?? null,
    expires_at: e.expires_at ?? null, permitted_uses: e.permitted_uses ?? [], facts: e.facts ?? [], status: e.status };
}
const people = () => S.data.contacts.map((c) => ({ contactId: c._id, names: [c.full_name_en, c.full_name_ar].filter(Boolean) }));
function accountSummary(id) {

function oppSummary(id) {

    knockouts: (o.screening?.knockouts ?? []).filter((k) => k.status !== "pass").map((k) => `${k.code} ${k.status}: ${k.detail}`) } : null;

function proofState() {
  const proofs = Q.projectProof(approvedEvidence({ maxTier: "tender" }), S.rules);
  return { proofs, documented: proofs.filter((p) => p.documented).length, ready: proofs.filter((p) => p.referenceReady).length, required: S.rules.proof_test.projects_required, due: S.rules.proof_test.due };
}

function canWrite() { return S.db && S.me.canWrite !== false && !S.readOnly; }
async function put(col, id, doc) {
  try { await S.db.collection(col).doc(id).set(clean(doc)); return true; }
  catch (e) { if (e.code === "invalid_argument" && S.me.canWrite === null) S.readOnly = true; toast(`Not saved. ${errorCopy(e)}`); schedule(); return false; }
}
async function patch(col, id, fields) {
  try { await S.db.collection(col).doc(id).update(clean(fields)); return true; }
  catch (e) { toast(`Not saved. ${errorCopy(e)}`); return false; }
}

// ------------------------------------------------------------------ boot
async function boot() {
  route();
  if (!Q) { S.bootError = "The console's code didn't load. Reload the page."; render(); return; }
  try {
    const [b, r] = await Promise.all([fetch("brand-rules.json"), fetch("business-rules.json")]);
    const brandText = await b.text(), rulesText = await r.text();
    S.brand = Q.BrandRulesSchema.parse(JSON.parse(brandText));
    const rules = Q.BusinessRulesSchema.parse(JSON.parse(rulesText));
    let hash = "local";
    try { const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(rulesText)); hash = [...new Uint8Array(d)].map((x) => x.toString(16).padStart(2, "0")).join("").slice(0, 12); } catch {}
    S.rulesVersion = `${rules.version}#${hash}`;
    S.rules = { ...rules, rulesVersion: S.rulesVersion };
  } catch (e) { S.bootError = "The console's rule files couldn't be read. Reload the page."; render(); return; }
  render();
  const use = (name) => window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const [sample, db, user] = await Promise.all([use("sample"), use("db"), use("user")]);
  S.sample = sample; S.sampleState = sample ? "ready" : "absent";
  if (user) {
    const [isOwner, canEdit, can, id] = await Promise.all([user.isOwner(), user.canEdit(), user.can("data.write"), user.id()]);
    S.me = { isOwner, canEdit, canWrite: can, id: id ?? (isOwner ? "owner" : null) };
  }
  if (!db) { S.dbState = "absent"; render(); return; }
  S.db = db; S.dbState = "ready";
  const timer = setTimeout(() => { if (S.loaded.size < COLS.length) { S.stale = true; schedule(); } }, 10000);
  const query = { queue: db.collection("queue").orderBy("created_at", "desc").limit(300), runs: db.collection("runs").orderBy("at", "desc").limit(40) };
  for (const col of COLS) {
    (query[col] ?? db.collection(col)).onSnapshot((snap) => {
      const docs = snap.docs.map((d) => ({ ...d.data(), _id: d.id }));
      if (col === "decisions") S.data.decisions = Object.fromEntries(docs.map((d) => [d._id, d]));
      else if (col === "checks") S.data.checks = Object.fromEntries(docs.map((d) => [d._id, d]));
      else if (col === "entity") S.data.entity = docs.find((d) => d._id === "master") ?? null;
      else S.data[col] = docs;
      if (!snap.metadata.fromCache) S.loaded.add(col);
      if (S.loaded.size >= COLS.length) { clearTimeout(timer); S.stale = false; }
      schedule();
    }, (e) => { S.errors[col] = e.code; S.loaded.add(col); if (e.code === "revoked") S.readOnly = true; schedule(); });
  }
  if (S.me.canEdit || S.me.isOwner) {
    db.collection("contacts").onSnapshot((snap) => { S.data.contacts = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); schedule(); }, () => {});
  }
  render();
}

function route() {
  const name = location.hash.replace("#", "");
  S.view = VIEWS.some(([v]) => v === name) ? name : "board";
}
window.addEventListener("hashchange", () => { route(); render(); window.scrollTo(0, 0); });

// ------------------------------------------------------------------ rendering
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  const active = document.activeElement;
  const focusId = active && active.id && view.contains(active) ? active.id : null;
  const sel = focusId && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  document.getElementById("nav").innerHTML = navHtml();
  document.getElementById("status").innerHTML = statusHtml();
  view.innerHTML = S.bootError ? `<div class="banner bad">${h(S.bootError)}</div>` : (S.rules ? VIEW_HTML[S.view]() : `<p class="empty">Loading the console…</p>`);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  }
}

function navHtml() {
  const waiting = S.data.queue.filter((a) => !S.data.decisions[a._id]).length;
  const bids = S.data.opps.filter((o) => o.stage === "screened" && !o.screening?.decision).length;
  const counts = { approvals: waiting, board: bids };
  return VIEWS.map(([v, label]) => `<button data-act="go" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ""}>${h(label)}${counts[v] ? `<span class="count">${counts[v]}</span>` : ""}</button>`).join("");
}

function statusHtml() {
  const role = S.me.isOwner ? "You: owner (Asil)" : S.me.canEdit ? "You: editor" : S.me.canWrite === false ? "You: view only" : "You: team member";
  const claude = S.sampleState === "ready" ? ["on", "Claude: on your plan"] : S.sampleState === "absent" ? ["off", "Claude: not available here"] : ["", "Claude: connecting"];
  const data = S.dbState === "ready" ? (S.stale ? ["", "Data: can't be reached yet"] : ["on", "Data: live"]) : S.dbState === "absent" ? ["off", "Data: not available here"] : ["", "Data: connecting"];
  return [claude, data].map(([c, t]) => `<div class="row"><span class="dot ${c}"></span>${h(t)}</div>`).join("") + `<div class="row"><span class="dot on"></span>${h(role)}</div>`;
}

function pageHead(title, sub, action = "") {
  return `<div class="page-head"><div><h1>${h(title)}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${action}</div>${notices()}`;
}

function notices() {
  const out = [];
  if (S.dbState === "absent") out.push(`<div class="banner warn">This view can't reach the console's data. Open the console in Claude, signed in.</div>`);
  else if (S.stale) out.push(`<div class="banner warn">The console's data can't be reached yet. What's shown may be out of date.</div>`);
  // The data rules let Contributors and up read and write; Viewers and Commenters are admitted but see no records.
  if (S.me.canWrite === false) out.push(`<div class="banner">You have view access to this page, and the console's records are shared with Contributors only. Ask Asil for Contributor access to see and use them.</div>`);
  else if (S.readOnly) out.push(`<div class="banner">Your access changed while the console was open. Reload the page; if changes still fail, ask Asil for Contributor access.</div>`);
  return out.join("");
}

// ------------------------------------------------------------------ Board
function rulerHtml(o) {
  const max = 150e6, pct = (v) => `${Math.min(100, Math.max(0, (v / max) * 100))}%`;
  const b = S.rules.contracting.band_sar;
  const lo = o.value_min_sar ?? o.value_max_sar, hi = o.value_max_sar ?? o.value_min_sar;
  const val = lo == null ? "" : `<span class="val" style="left:${pct(lo)};width:calc(${pct(hi)} - ${pct(lo)})" title="${h(band(o))}"></span>`;
  const ticks = [0, 20e6, 50e6, 100e6, 150e6].map((t) => `<span class="tick" style="left:${pct(t)}">${t / 1e6}</span>`).join("");
  return `<div class="ruler" aria-label="Value against the SAR 20 to 100 million band"><span class="track"></span><span class="band" style="left:${pct(b.min)};width:calc(${pct(b.max)} - ${pct(b.min)})"></span>${val}${ticks}</div>`;
}

function viewBoard() {
  const opps = S.data.opps;
  const bids = opps.filter((o) => o.stage === "screened" && o.screening && !o.screening.decision);
  const waiting = S.data.queue.filter((a) => !S.data.decisions[a._id]);
  const proof = proofState();
  const alerts = Q.consoleAlerts(opps, S.rules, new Date());
  const t = today();
  const expiring = S.data.evidence.filter((e) => e.status === "approved" && e.expires_at && daysTo(e.expires_at) <= 60).sort((a, b) => a.expires_at.localeCompare(b.expires_at));
  const due = Q.dueItems(S.data.units, t, S.rules.maintenance.renewal_window_days);
  const site = S.data.checks.site, mail = S.data.checks.mail;
  const decisions = bids.map((o) => {
    const s = o.screening;
    const advice = s.overall === "fail" ? "Recommendation: no-bid, unless you override with a reason." : s.overall === "verify" ? "Recommendation: resolve the items marked verify, then decide." : "Knock-outs clear: decide on the scorecard.";
    return `<div class="panel panel-pad decision">
      <div class="row between"><h3>${h(o.title)}</h3>${chip(`knock-outs ${s.overall}`, koTone(s.overall))}</div>
      <div class="row small muted"><span class="mono">${h(o.id)}</span><span>${h(accountName(o.account_id))}</span><span>${h(band(o))}</span><span>Decision ${h(dueText(s.decision_due))}</span></div>
      ${rulerHtml(o)}
      <div class="small">${h(advice)}</div>
      <div class="row">${s.knockouts.filter((k) => k.status !== "pass").map((k) => chip(`${k.code} ${k.status}`, koTone(k.status))).join("")}</div>
      <div><button class="btn small primary" data-act="open-opp" data-id="${h(o.id)}">Decide</button></div>
    </div>`;
  }).join("");
  const pipeRows = (motion) => {
    const open = opps.filter((o) => o.motion === motion && Q.isOpen(o.stage));
    const stages = [...new Set(open.map((o) => o.stage))];
    if (!open.length) return `<p class="empty">None open.</p>`;
    return `<table><tbody>${stages.map((st) => { const list = open.filter((o) => o.stage === st); const hi = list.reduce((n, o) => n + (o.value_max_sar ?? o.value_min_sar ?? 0), 0);
      return `<tr><td>${stageChip(st)}</td><td class="num">${list.length}</td><td class="num muted">${motion === "contracting" && hi ? "up to SAR " + sarM(hi) : ""}</td></tr>`; }).join("")}</tbody></table>`;
  };
  const barItem = (ok, label) => `<div class="row">${chip(ok ? "met" : "not met", ok ? "ok" : "bad")}<span>${h(label)}</span></div>`;
  return pageHead("Board", `What needs you this week. ${proof.documented} of ${proof.required} projects documented for the proof test due ${h(fmtDate(proof.due))}.`) + `
  <section><h2>Decisions for you</h2>
    <div class="grid cols-2">${decisions || `<div class="panel panel-pad empty">No bid decisions waiting.</div>`}
      <div class="panel panel-pad stack">
        <div class="row between"><h3>Approvals</h3>${chip(`${waiting.length} waiting`, waiting.length ? "warn" : "ok")}</div>
        ${waiting.slice(0, 5).map((a) => `<div class="row between small"><span>${h(a.title)}</span><span class="row">${chip(a.audience)}${a.gateReport?.passed ? "" : chip("blocked", "bad")}</span></div>`).join("") || `<p class="empty">Nothing waiting. Drafts from the agents land here.</p>`}
        <div><button class="btn small" data-act="go" data-view="approvals">Open approvals</button></div>
      </div>
    </div>
  </section>
  <section><h2>Proof</h2>
    <div class="panel panel-pad stack">
      <div class="row between"><div class="row"><span class="big">${proof.documented}<span class="muted" style="font-size:18px"> of ${proof.required}</span></span><span class="small muted">projects documented: contract value, start and completion dates, contract and completion certificate</span></div>${chip(`due ${fmtDate(proof.due)}`, proof.documented >= proof.required ? "ok" : "warn")}</div>
      <div class="meter">${Array.from({ length: proof.required }, (_, i) => `<i class="${i < proof.documented ? "on" : ""}"></i>`).join("")}</div>
      <div class="small muted">${proof.proofs.length ? `${proof.proofs.filter((p) => !p.documented).length} projects on file are missing documents. The commonest gap: ${h(topMissing(proof.proofs))}.` : "No project evidence on file yet."} <button class="linkish" data-act="go" data-view="proof">See every project</button></div>
    </div>
  </section>
  <div class="grid cols-2">
    <section><h2>Contracting pipeline</h2><div class="panel panel-pad">${pipeRows("contracting")}</div></section>
    <section><h2>Elevators and maintenance</h2><div class="panel panel-pad">${pipeRows("elevator")}</div></section>
  </div>
  <div class="grid cols-2">
    <section><h2>Alerts</h2><div class="panel panel-pad stack small">${alerts.map((a) => `<div class="row between"><span>${h(a.title)}: ${h(a.detail)}</span><span class="muted">${h(a.owner)}</span></div>`).join("") || `<p class="empty">No alerts.</p>`}</div></section>
    <section><h2>Coming due</h2><div class="panel panel-pad stack small">
      ${expiring.map((e) => `<div class="row between"><span>${h(e.title)}</span>${chip(`${daysTo(e.expires_at)} days`, daysTo(e.expires_at) <= 30 ? "bad" : "warn")}</div>`).join("")}
      ${due.map((d) => `<div class="row between"><span>${h(d.kind.replace("_", " "))}: ${h(d.site)}</span>${chip(d.overdue ? "overdue" : `${d.days} days`, d.overdue || d.days <= 30 ? "bad" : "warn")}</div>`).join("")}
      ${!expiring.length && !due.length ? `<p class="empty">Nothing due in the next 60 days.</p>` : ""}
    </div></section>
  </div>
  <section><h2>Public footprint</h2><div class="grid cols-2">
    <div class="panel panel-pad stack small"><div class="row between"><h3>Website</h3>${site ? chip(`${Object.values(site.verdict.bar).filter(Boolean).length} of 4 met`, "warn") : chip("not checked")}</div>
      ${site ? [barItem(site.verdict.bar.nothing_false, "Nothing false"), barItem(site.verdict.bar.working_contacts, "Working contacts"), barItem(site.verdict.bar.both_languages, "Both languages"), barItem(site.verdict.bar.enquiry_form_with_consent, "Enquiry form with consent wording")].join("") : ""}
    </div>
    <div class="panel panel-pad stack small"><div class="row between"><h3>Quote inbox</h3>${mail ? chip(mail.report.verdict.replace("_", " "), mail.report.verdict === "protected" ? "ok" : "bad") : chip("not checked")}</div>

    </div>
  </div></section>`;
}

function topMissing(proofs) {
  const n = {};
  for (const p of proofs) for (const m of p.missing) n[m] = (n[m] ?? 0) + 1;
  return Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0] ?? "none";
}

async function runAgent(kind, input) {
  const ctl = new AbortController();
  const t0 = Date.now();
  S.run = { kind, status: "running", steps: [], ctl };
  const add = (label, state = "running", detail = "") => { const s = { label, state, detail, start: Date.now(), ms: null }; S.run.steps.push(s); schedule(); return s; };
  const end = (s, state, detail) => { s.state = state; if (detail !== undefined) s.detail = detail; s.ms = Date.now() - s.start; schedule(); };
  add("Personal data removed before Claude sees the input", "done");
  const model = new Q.SampleModelClient(S.sample, { signal: ctl.signal, publicNumbers: publicNumbers() });
  const env = {
    brand: S.brand, rulesVersion: S.rulesVersion, people: people(), publicNumbers: publicNumbers(),
    callAgent: async (agent, pv, fn) => {
      const s = add(STEP_LABEL[agent] ?? agent);
      try { const r = await fn(model); end(s, "done", `answered on your Claude plan (${r.modelServed.replace("claude-plan:", "")} tier)`); return r; }
      catch (e) { end(s, "failed", errorCopy(e)); throw e; }
    },
    step: (st) => { const s = add(st.step.startsWith("gates") ? `Checks: brand, figures, personal data${st.step.includes("2") ? " (after the revision)" : ""}` : st.step.replace(/^remove failing sentences$/, "Removed the sentences that still failed"), st.outcome === "ok" ? "done" : "blocked");
      const d = st.details ?? {};
      s.detail = d.removed != null ? `${d.removed} removed` : [d.blocking != null ? `${d.blocking} blocking` : "", d.warnings != null ? `${d.warnings} warnings` : ""].filter(Boolean).join(", ");
      s.ms = 0; },
  };
  try {
    let res;
    if (kind === "case_study") res = await Q.caseStudyWorkflow(env, input, approvedEvidence({ maxTier: input.audience === "public" ? "public" : "tender", projectRef: input.project_ref }));
    else if (kind === "meeting_brief") {
      const ev = approvedEvidence({ maxTier: "tender" });
      res = await Q.meetingBriefWorkflow(env, input, { account: accountSummary(input.account_id), opportunity: input.opportunity_id ? oppSummary(input.opportunity_id) : null, evidence: ev, proof: Q.projectProof(ev, S.rules) });
    } else if (kind === "meeting_debrief") res = await Q.meetingDebriefWorkflow(env, input, { account: accountSummary(input.account_id) });
    else res = await Q.bilingualWorkflow(env, input, approvedEvidence({ maxTier: input.audience === "public" ? "public" : "tender", ...(input.project_ref ? { projectRef: input.project_ref } : {}) }));
    const runId = newId("RUN");
    let artId = null;
    if (res.artifact) {
      artId = newId("ART");
      const ok = await put("queue", artId, { ...res.artifact, status: res.status, note: res.note ?? null, created_by: S.me.id, created_at: new Date().toISOString(), run_id: runId });
      if (!ok) artId = null;
    }
    S.run.status = res.status;
    S.run.result = artId ? { id: artId, note: res.note, passed: res.artifact.gateReport.passed, blocking: res.artifact.gateReport.blocking.length, warnings: res.artifact.gateReport.warnings.length } : null;
    if (!res.artifact && res.note) S.run.error = res.note;
    await put("runs", runId, { at: new Date().toISOString(), by: S.me.id, agent: kind, status: res.status, artifact_id: artId, note: res.note ?? null,
      duration_ms: Date.now() - t0, steps: S.run.steps.map((s) => ({ label: s.label, state: s.state, detail: s.detail, ms: s.ms })) });
    toast(artId ? "Draft sent to Approvals." : "The run finished without a draft.");
  } catch (e) {
    S.run.status = e instanceof Q.ModelCancelledError ? "stopped" : "failed";
    S.run.error = errorCopy(e);
  }
  schedule();
}

// ------------------------------------------------------------------ Approvals
function renderDoc(text) {
  if (!text) return "";
  const ar = hasArabic(text) && !/[A-Za-z]{4,}/.test(text.replace(/[\u0600-\u06FF\s.,،؛]/g, "").slice(0, 200));
  const out = [];
  let list = null;
  const inline = (s) => h(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } continue; }
    if (line.startsWith("- ")) { (list ??= []).push(`<li>${inline(line.slice(2))}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line.startsWith("# ")) out.push(`<h3>${inline(line.slice(2))}</h3>`);
    else if (line.startsWith("## ")) out.push(`<h4>${inline(line.slice(3))}</h4>`);
    else out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return `<div class="doc ${ar ? "ar" : ""}" ${ar ? 'dir="rtl" lang="ar"' : ""}>${out.join("")}</div>`;
}

function approvalBlocker(a) {
  const external = a.audience === "client" || a.audience === "public";
  if (external && !a.gateReport?.passed) return "It failed its checks. Client and public material can't be approved until it passes: reject it with a reason, or run the agent again.";
  if (external && a.evidenceTierMax === "internal") return "It rests on internal evidence, which never leaves Qottuf.";
  return null;
}

  <div class="panel table-wrap">${list.length ? `<table><thead><tr><th>Draft</th><th>For</th><th>Checks</th><th>When</th></tr></thead><tbody>${list.map((a) => `

    <td>${chip(a.audience)}</td><td>${a.gateReport?.passed ? chip("passed", "ok") : chip("blocked", "bad")}</td><td class="small muted">${h(fmtDateTime(a.created_at))}</td></tr>`).join("")}</tbody></table>`
    : `<p class="empty panel-pad">${f === "waiting" ? "Nothing waiting. Run an agent to produce a draft." : "None yet."}</p>`}</div>
  ${sel ? artDetail(sel) : ""}`;
}

function artDetail(a) {
  const d = S.data.decisions[a._id];
  const g = a.gateReport ?? { blocking: [], warnings: [], verified: [] };
  const blocker = approvalBlocker(a);
  const finding = (f) => `<div class="finding ${f.severity}"><span class="rule">${h(f.rule)}${f.lang ? ` · ${h(f.lang)}` : ""}</span><q>${h(f.quote)}</q><span class="small muted">${h(f.why)}</span></div>`;
  const removed = a.content?.removed ?? [];
  const forAsil = a.content?.for_asil_to_check ?? [];
  return `<section class="panel panel-pad stack" id="art-detail">
    <div class="row between"><div><h3>${h(a.title)}</h3><div class="small muted">${h(a.artifactType.replace("_", " "))} · ${h(fmtDateTime(a.created_at))}</div></div><button class="btn small" data-act="close-art">Close</button></div>
    <div class="row">${chip(`for ${a.audience}`)}${g.passed ? chip("checks passed", "ok") : chip("checks blocked", "bad")}${chip(`${(g.verified ?? []).length} figures verified`)}${d ? chip(d.status, d.status === "approved" ? "ok" : "bad") : chip("waiting", "warn")}</div>
    ${a.note ? `<p class="small" style="margin:0">${h(a.note)}</p>` : ""}
    <div class="grid ${a.renderedAr ? "cols-2" : ""}">
      ${a.renderedEn ? `<div class="panel panel-pad">${renderDoc(a.renderedEn)}<div style="margin-top:10px"><button class="btn small" data-act="copy" data-lang="en" data-id="${h(a._id)}">Copy English</button></div></div>` : ""}
      ${a.renderedAr ? `<div class="panel panel-pad"><div class="doc ar" dir="rtl" lang="ar">${h(a.renderedAr).split("\n").map((l) => l.trim() ? `<p>${l}</p>` : "").join("")}</div><p class="small muted">Arabic needs your review before first use.</p><div><button class="btn small" data-act="copy" data-lang="ar" data-id="${h(a._id)}">Copy Arabic</button></div></div>` : ""}
    </div>
    ${forAsil.length ? `<div class="stack"><div class="h2">For you to check</div>${forAsil.map((x) => `<div class="finding signal">${h(x)}</div>`).join("")}</div>` : ""}
    ${removed.length ? `<div class="stack"><div class="h2">Sentences the checks removed</div>${removed.map((r) => `<div class="finding fail"><span class="rule">${h(r.reasons.join(", "))} · ${h(r.lang)}</span><q>${h(r.sentence)}</q></div>`).join("")}</div>` : ""}
    ${g.blocking.length ? `<div class="stack"><div class="h2">Blocking</div>${g.blocking.map(finding).join("")}</div>` : ""}
    ${g.warnings.length ? `<details ${S.ui.open.warn ? "open" : ""} data-key="warn"><summary>Warnings (${g.warnings.length})</summary><div class="stack" style="margin-top:8px">${g.warnings.map(finding).join("")}</div></details>` : ""}
    <details ${S.ui.open.prov ? "open" : ""} data-key="prov"><summary>How it was made</summary><dl class="kv small" style="margin-top:8px"><dt>Prompts</dt><dd class="mono">${h((a.provenance?.prompt_versions ?? []).join(", ") || "code only")}</dd><dt>Answered by</dt><dd>${h((a.provenance?.models_served ?? []).join(", ") || "code only")}</dd><dt>Rules</dt><dd class="mono">${h(a.provenance?.rules_version ?? "")}</dd><dt>Evidence</dt><dd class="mono">${h((a.provenance?.evidence_ids ?? []).join(", "))}</dd></dl></details>
    ${d ? `<p class="small">${h(d.status === "approved" ? "Approved" : "Rejected")} ${h(fmtDateTime(d.at))}${d.reason ? `: ${h(d.reason)}` : ""}.</p>` : S.me.isOwner ? `
      <form data-form="decide-art" data-id="${h(a._id)}" class="stack">
        ${blocker ? `<div class="banner warn">${h(blocker)}</div>` : ""}
        <label class="f">Reason <span class="hint">needed to reject</span><input type="text" id="art-reason" name="reason" value="${h(dv("decide-art", "reason"))}"></label>
        <div class="row"><button class="btn primary" name="act" value="approved" ${blocker ? "disabled" : ""}>Approve</button><button class="btn danger" name="act" value="rejected">Reject</button><span class="form-error" id="decide-art-error"></span></div>
      </form>` : `<p class="small muted">Only Asil approves.</p>`}
  </section>`;
}

// ------------------------------------------------------------------ Proof
function viewProof() {
  const proof = proofState();
  const all = [...S.data.evidence_drafts.map((d) => ({ ...d, status: "draft", _draft: true })), ...S.data.evidence];
  const projects = [...new Set(all.map((e) => e.project_ref).filter(Boolean))].sort();
  const pf = S.ui.evProject;
  const list = all.filter((e) => pf === "all" ? true : pf === "company" ? !e.project_ref : e.project_ref === pf)
    .sort((a, b) => Number(Boolean(b._draft)) - Number(Boolean(a._draft)) || (a.project_ref ?? "").localeCompare(b.project_ref ?? "") || a.type.localeCompare(b.type));
  const drafts = S.data.evidence_drafts.length;
  const yes = (v) => v ? chip("yes", "ok") : chip("missing", "bad");
  return pageHead("Proof", `The proof test asks for Qottuf's own documents for ${proof.required} projects by ${h(fmtDate(proof.due))}: contract value, start and completion dates, the contract and the completion certificate.`,
    canWrite() ? `<button class="btn primary" data-act="add-evidence">File evidence</button>` : "") + `
  ${drafts && S.me.isOwner ? `<div class="banner">${drafts} filed record${drafts === 1 ? " is" : "s are"} waiting for your approval (gate S-G5). Agents can't use ${drafts === 1 ? "it" : "them"} until you approve.</div>` : ""}
  ${S.ui.addEvidence ? evidenceForm(projects) : ""}
  <section><h2>Projects</h2><div class="panel table-wrap"><table><thead><tr><th>Project</th><th>Contract value</th><th>Dates</th><th>Contract</th><th>Completion certificate</th><th>Referee consent</th><th>Proof test</th></tr></thead><tbody>
    ${proof.proofs.map((p) => `<tr><td class="mono">${h(p.projectRef)}</td><td class="num">${p.contractValueSar != null ? "SAR " + h(p.contractValueSar.toLocaleString("en-US")) : chip("missing", "bad")}</td><td>${p.startDate && p.completionDate ? h(`${p.startDate} to ${p.completionDate}`) : chip("missing", "bad")}</td><td>${yes(p.hasContract)}</td><td>${yes(p.hasCompletionCertificate)}</td><td>${yes(p.hasRefereeConsent)}</td><td>${p.documented ? chip("documented", "ok") : chip("not yet", "warn")}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No approved project evidence yet.</td></tr>`}
  </tbody></table></div></section>
  <section><h2>Evidence on file</h2>
    <div class="row" style="margin-bottom:10px"><label class="f" style="min-width:220px">Show<select id="ev-filter" data-act="ev-project">${[["all", "Everything"], ["company", "Company records"], ...projects.map((p) => [p, p])].map(([v, l]) => `<option value="${h(v)}" ${pf === v ? "selected" : ""}>${h(l)}</option>`).join("")}</select></label></div>
    <div class="stack">${list.map(evidenceCard).join("") || `<p class="empty">No evidence filed.</p>`}</div>
  </section>`;
}

function evidenceCard(e) {
  const expired = e.expires_at && e.expires_at < today();
  const tenderNaming = e.type === "client_naming_approval";
  return `<div class="panel panel-pad stack">
    <div class="row between"><div><strong>${h(e.title)}</strong><div class="small muted"><span class="mono">${h(e._id)}</span>${e.project_ref ? ` · ${h(e.project_ref)}` : ""} · ${h(e.type.replace(/_/g, " "))}${e.source ? ` · ${h(e.source)}` : ""}</div></div>
      <div class="row">${chip(e.tier)}${chip(e.status, e.status === "approved" ? "ok" : e.status === "withdrawn" ? "bad" : "warn")}${e.expires_at ? chip(expired ? "expired" : `expires ${fmtDate(e.expires_at)}`, expired ? "bad" : daysTo(e.expires_at) <= 60 ? "warn" : "") : ""}</div></div>
    ${e.facts?.length ? `<div class="small">${e.facts.map((f) => `<div>${h(f.label)}${f.kind !== "statement" ? `: <span class="num">${h(typeof f.value === "number" ? f.value.toLocaleString("en-US") : f.value)}</span>${f.unit ? " " + h(f.unit) : ""}` : ""}</div>`).join("")}</div>` : ""}

}

// ------------------------------------------------------------------ Lifts
function viewLifts() {
  const units = S.data.units;
  // Lifts entered from a project record carry unverified: true until someone confirms their details; their unknowns
  // are listed as "to confirm", not as facts (an unknown maintenance status is not "never offered").
  const known = units.filter((u) => !u.unverified);
  const toConfirm = units.length - known.length;
  const due = Q.dueItems(known, today(), S.rules.maintenance.renewal_window_days);
  const gaps = Q.registryGaps(known, S.data.opps);
  const cands = Q.renewalCandidates(known, S.data.opps, today(), S.rules.maintenance.renewal_window_days);
  const sel = S.ui.selUnit ? units.find((u) => u._id === S.ui.selUnit) : null;
  const gapCounts = {};
  for (const g of gaps) gapCounts[g.kind] = (gapCounts[g.kind] ?? 0) + 1;
  const GAP = { won_without_unit: "sold but not registered", no_maintenance_offer: "maintenance never offered", no_origin_document: "no certificate of origin", no_owner_consent: "no owner agreement to contact", no_inspection_date: "no inspection date" };
  return pageHead("Lifts", "Every lift Qottuf installed or maintains, with the dates that give a reason to call: warranty end, contract end, the annual inspection and registration.",
    canWrite() ? `<div class="row"><button class="btn" data-act="add-unit">Register a lift</button><button class="btn primary" data-act="renewals" ${cands.length ? "" : "disabled"}>Create ${cands.length} renewal opportunit${cands.length === 1 ? "y" : "ies"}</button></div>` : "") + `
  ${S.ui.addUnit ? unitForm() : ""}
  <div class="grid cols-2">
    <section><h2>Due in the next ${S.rules.maintenance.renewal_window_days} days</h2><div class="panel panel-pad stack small">${due.map((d) => `<div class="row between"><span>${h(d.kind.replace("_", " "))}: ${h(d.site)}${d.contactable ? "" : ` <span class="muted">(owner not yet agreed)</span>`}</span>${chip(d.overdue ? "overdue" : `${d.days} days`, d.overdue || d.days <= 30 ? "bad" : "warn")}</div>`).join("") || `<p class="empty">Nothing due.</p>`}</div></section>
    <section><h2>Gaps to close</h2><div class="panel panel-pad stack small">${toConfirm ? `<div class="row between"><span>lifts from project records whose details aren't confirmed yet</span>${chip(String(toConfirm), "warn")}</div>` : ""}${Object.entries(gapCounts).map(([k, n]) => `<div class="row between"><span>${h(GAP[k])}</span>${chip(String(n), "warn")}</div>`).join("") || (toConfirm ? "" : `<p class="empty">No gaps.</p>`)}</div></section>
  </div>
  <div class="panel table-wrap">${units.length ? `<table><thead><tr><th>Lift</th><th>Source</th><th>Warranty ends</th><th>Contract</th><th>Next inspection</th><th>Owner agreed</th></tr></thead><tbody>${units.map((u) => `
    <tr class="click ${S.ui.selUnit === u._id ? "sel" : ""}" data-act="open-unit" data-id="${h(u._id)}"><td>${h(u.site)}<div class="small muted mono">${h(u._id)}</div></td><td>${h(u.source)}</td>
    <td>${u.warranty_ends_at ? h(fmtDate(u.warranty_ends_at)) : chip("unknown")}</td><td>${u.maintenance_contract ? h(`to ${fmtDate(u.maintenance_contract.ends_at)}`) : u.unverified ? chip("to confirm", "warn") : chip(u.maintenance_offer.replace("_", " "), u.maintenance_offer === "accepted" ? "ok" : "warn")}</td>
    <td>${u.next_inspection_due ? h(fmtDate(u.next_inspection_due)) : chip("unknown")}</td><td>${u.owner_consent_at ? chip("yes", "ok") : chip("no", "bad")}</td></tr>`).join("")}</tbody></table>` : `<p class="empty panel-pad">No lifts registered. Register the lifts Qottuf installed, with each owner's agreement.</p>`}</div>
  ${sel ? unitDetail(sel) : ""}`;
}

      <div class="row"><button class="btn primary">Save</button><span class="form-error" id="${F}-error"></span></div></form>` : ""}
  </section>`;

function viewFootprint() {
  const ent = S.data.entity;
  const site = S.data.checks.site, mail = S.data.checks.mail;
  const listings = S.data.listings;
  const fields = ent?.fields ?? {};
  const report = (l) => { const last = l.observations?.[l.observations.length - 1]; return last && ent ? Q.compareToEntity(fields, last.observed, S.brand) : []; };
  // The website's failures grouped by rule, with what was found where, so the list reads as work to do.
  const byRule = new Map();
  const addFail = (rule, quote, page, why) => {
    const g = byRule.get(rule) ?? { rule, n: 0, quotes: new Map(), why: "" };
    g.n++;
    if (!g.why && why) g.why = why;
    const q = String(quote ?? "").trim();
    if (q) g.quotes.set(q, [...new Set([...(g.quotes.get(q) ?? []), page])]);
    byRule.set(rule, g);
  };
  for (const p of site?.pages ?? []) {
    for (const f of (p.findings ?? []).filter((x) => x.severity === "fail")) addFail(f.check, f.detail, p.url, "");
    for (const f of p.text_failures ?? []) addFail(f.rule, f.quote, p.url, f.why);
  }
  return pageHead("Footprint", "One master company record, and every public listing checked against it, so a reviewer finds the same facts everywhere.") + `
  <section><h2>Master company record</h2><div class="panel panel-pad stack">
    <div class="row between"><h3>${ent?.status === "approved" ? `Approved ${h(fmtDate(ent.approved_at))}` : "Proposed: awaiting your approval"}</h3><div class="row">${ent ? chip(ent.status, ent.status === "approved" ? "ok" : "warn") : chip("none")}${S.me.isOwner ? `<button class="btn small" data-act="entity-edit">${S.ui.editEntity ? "Close the editor" : "Edit"}</button>` : ""}</div></div>
    ${S.ui.editEntity && S.me.isOwner ? entityForm(ent) : ent ? `<dl class="kv">${Object.entries(ENTITY_LABEL).filter(([k]) => fields[k] != null && fields[k] !== "").map(([k, l]) => `<dt>${h(l)}</dt><dd class="${/_ar$/.test(k) ? "ar" : ""}">${h(fields[k])}</dd>`).join("")}</dl>
      ${Object.keys(ENTITY_LABEL).filter((k) => !fields[k] && !["address_ar", "vat_number"].includes(k)).length ? `<p class="small muted" style="margin:0">Not filled in: ${h(Object.keys(ENTITY_LABEL).filter((k) => !fields[k] && !["address_ar", "vat_number"].includes(k)).map((k) => ENTITY_LABEL[k]).join(", "))}.</p>` : ""}` : `<p class="empty">No master record yet.</p>`}
    ${ent?.questions?.length && !S.ui.editEntity ? `<div class="stack"><div class="h2">Questions to settle first</div>${ent.questions.map((q) => `<div class="finding signal"><span>${bidi(q)}</span></div>`).join("")}</div>` : ""}
    ${S.me.isOwner && ent && ent.status !== "approved" && !S.ui.editEntity ? `<div class="row"><button class="btn primary" data-act="entity-approve">Approve as the master record</button><span class="form-error" id="entity-error"></span></div>` : ""}
  </div></section>
  <div class="grid cols-2">
    <section><h2>Website</h2><div class="panel panel-pad stack small">
      ${site ? `<div class="row between"><strong>${Object.values(site.verdict.bar).filter(Boolean).length} of 4 requirements met</strong><span class="muted">checked ${h(fmtDate(site.checked_at))}</span></div>
        ${[["nothing_false", "Nothing false"], ["working_contacts", "Working contacts"], ["both_languages", "Both languages"], ["enquiry_form_with_consent", "Enquiry form with consent wording"]].map(([k, l]) => `<div class="row">${chip(site.verdict.bar[k] ? "met" : "not met", site.verdict.bar[k] ? "ok" : "bad")}<span>${l}</span></div>`).join("")}
        <div class="h2" style="margin-top:6px">${site.verdict.fails} failures, by kind</div>
        ${[...byRule.values()].sort((a, b) => b.n - a.n).map((g) => `<div class="finding fail"><div class="row between"><span class="rule">${h(g.rule)}</span><span class="num">${g.n}</span></div>
          ${[...g.quotes].slice(0, 4).map(([q, pages]) => `<div><q>${h(q)}</q> <span class="small muted">${h(pages.join(", "))}</span></div>`).join("")}${g.quotes.size > 4 ? `<span class="small muted">and ${g.quotes.size - 4} more</span>` : ""}
          ${g.why ? `<span class="small muted">${h(g.why)}</span>` : ""}</div>`).join("")}
        <p class="muted" style="margin:0">${h(site.source ?? "")}</p>` : `<p class="empty">Not checked yet.</p>`}
    </div></section>
    <section><h2>Quote inbox</h2><div class="panel panel-pad stack small">
      ${mail ? `<div class="row between"><strong>@${h(mail.report.domain)}</strong>${chip(mail.report.verdict.replace("_", " "), mail.report.verdict === "protected" ? "ok" : "bad")}</div><p style="margin:0">${h(mail.report.summary)}</p>
        <dl class="kv"><dt>MX</dt><dd class="mono">${h(mail.report.mx.hosts.join(", ") || "none")}</dd><dt>SPF</dt><dd class="mono">${h(mail.report.spf.record ?? "none")}</dd><dt>DKIM</dt><dd>${h(mail.report.dkim.found.join(", ") || "not found")}</dd><dt>DMARC</dt><dd class="mono">${h(mail.report.dmarc.record ?? "none")}</dd></dl>
        ${[...mail.report.spf.issues, ...mail.report.dmarc.issues].map((i) => `<div class="finding fail">${h(i)}</div>`).join("")}
        ${mail.fix ? `<div class="h2">The fix, for whoever manages the domain</div>${mail.fix_note ? `<p style="margin:0">${h(mail.fix_note)}</p>` : ""}${mail.fix.map((x) => `<div class="row between" style="flex-wrap:nowrap"><span class="mono" style="overflow-wrap:anywhere;min-width:0">${h(x)}</span><button class="btn small" data-act="copy-text" data-text="${h(x)}">Copy</button></div>`).join("")}` : ""}
        <p class="muted" style="margin:0">Checked ${h(fmtDate(mail.checked_at))}. Re-run with <span class="mono">npm run check -- mail ${h(mail.report.domain)}</span>.</p>` : `<p class="empty">Not checked yet.</p>`}
    </div></section>
  </div>
  <section><h2>Listings</h2><div class="panel table-wrap">${listings.length ? `<table><thead><tr><th>Where</th><th>Last checked</th><th>Against the master record</th></tr></thead><tbody>${listings.map((l) => { const r = report(l); const bad = r.filter((x) => x.severity === "fail"); const last = l.observations?.[l.observations.length - 1];
      return `<tr><td>${h(PLATFORM[l.platform] ?? l.platform.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()))}<div class="small muted">${h(l.url ?? "")}</div></td><td class="small">${last ? h(fmtDate(last.at)) : chip("never", "warn")}</td><td class="small">${!last ? `<span class="muted">Not checked yet: compare it with the master record.</span>` : bad.length ? bad.map((b) => `<div style="color:var(--bad)">${h(b.why)}</div>`).join("") + `<div class="muted">Seen there: ${bidi([...new Set(bad.map((b) => b.observed))].join("; "))}</div>` : chip("matches", "ok")}</td></tr>`; }).join("")}</tbody></table>` : `<p class="empty panel-pad">No listings yet.</p>`}</div></section>
  <section><h2>Check a page's HTML</h2><form class="panel panel-pad" data-form="sitecheck">
    <label class="f">Paste the page source <span class="hint">checked here, in your browser, against the same rules</span><textarea class="tall mono" id="site-html" name="html">${h(dv("sitecheck", "html"))}</textarea></label>
    <div class="row"><button class="btn primary">Check</button></div>
    ${S.ui.siteResult ? siteResultHtml(S.ui.siteResult) : ""}</form></section>`;
}

function siteResultHtml(a) {
  const fails = [...a.findings.filter((f) => f.severity === "fail").map((f) => ({ rule: f.check, quote: f.detail, why: "" })), ...a.textFindings.filter((f) => f.severity === "fail")];
  return `<div class="stack"><div class="row">${chip(`${fails.length} failures`, fails.length ? "bad" : "ok")}${chip(`lang ${a.lang ?? "missing"}`)}${chip(`${a.forms.count} forms`)}</div>
    ${fails.map((f) => `<div class="finding fail"><span class="rule">${h(f.rule)}</span><q>${h(f.quote)}</q>${f.why ? `<span class="small muted">${h(f.why)}</span>` : ""}</div>`).join("")}</div>`;
}

    ${r.blocking.map((f) => `<div class="finding fail"><span class="rule">${h(f.rule)} · ${h(f.lang)}</span><q>${h(f.quote)}</q><span class="small muted">${h(f.why)}${f.fix ? ` Fix: ${h(f.fix)}` : ""}</span></div>`).join("")}
    ${r.warnings.map((f) => `<div class="finding signal"><span class="rule">${h(f.rule)} · ${h(f.lang)}</span><q>${h(f.quote)}</q><span class="small muted">${h(f.why)}</span></div>`).join("")}
    ${r.verified.length ? `<details><summary>Verified figures (${r.verified.length})</summary><div class="stack small" style="margin-top:8px">${r.verified.map((v) => `<div><span class="num">${h(v.raw)}</span>: ${h(v.label)} <span class="mono muted">${h(v.sourceId)}</span></div>`).join("")}</div></details>` : ""}
