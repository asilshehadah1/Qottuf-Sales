const VIEW_HTML = { board: viewBoard, pipeline: viewPipeline, agents: viewAgents, approvals: viewApprovals, proof: viewProof, lifts: viewLifts, footprint: viewFootprint, check: viewCheck };

// ------------------------------------------------------------------ events
document.addEventListener("input", (e) => {
  const form = e.target.closest("form[data-form]");
  if (!form || !e.target.name || e.target.type === "checkbox") return;
  (S.drafts[formKey(form)] ??= {})[e.target.name] = e.target.value;
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("[data-act=show-closed]")) { S.ui.showClosed = t.checked; render(); return; }
  if (t.matches("[data-act=ev-project]")) { S.ui.evProject = t.value; render(); return; }
  const form = t.closest("form[data-form]");
  if (form && t.name) {
    const d = (S.drafts[formKey(form)] ??= {});
    if (t.type === "checkbox") d[`line:${t.value}`] = t.checked;
    else d[t.name] = t.value;
    if (t.hasAttribute("data-redraw")) render();
  }
});
document.addEventListener("toggle", (e) => { const d = e.target; if (d.matches?.("details[data-key]")) S.ui.open[d.dataset.key] = d.open; }, true);

function formKey(form) {
  return { "agent-brief": "brief", "agent-debrief": "debrief", "agent-case": "case", "agent-bilingual": "bi" }[form.dataset.form] ?? form.dataset.form;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case "go": location.hash = t.dataset.view; break;
    case "pipe-filter": S.ui.pipeFilter = t.dataset.v; render(); break;
    case "new-opp": S.ui.newOpp = true; render(); break;
    case "new-account": S.ui.newAccount = true; render(); break;
    case "close-account": S.ui.newAccount = false; render(); break;
    case "close-new-opp": S.ui.newOpp = false; render(); break;
    case "open-opp": if (S.ui.selOpp !== id) { S.drafts.move = {}; S.drafts.decide = {}; S.drafts.nextstep = {}; } S.ui.selOpp = id; if (S.view !== "pipeline") location.hash = "pipeline"; else render(); setTimeout(() => document.getElementById("opp-detail")?.scrollIntoView({ block: "start" }), 0); break;
    case "close-opp": S.ui.selOpp = null; render(); break;
    case "decide-pick": (S.drafts.decide ??= {}).decision = t.dataset.v; render(); break;
    case "screen": {
      const o = byId(S.data.opps, id);
      try { const next = Q.screenOpportunity(o, { now: new Date(), by: S.me.id, rules: S.rules, evidence: S.data.evidence.map(toRecord) }); if (await put("opps", next.id, next)) toast(`Screened: knock-outs ${next.screening.overall}. The 48-hour decision clock has started.`); }
      catch (err) { toast(errorCopy(err)); }
      break;
    }
    case "pick-agent": S.ui.agent = t.dataset.v; render(); break;
    case "stop-run": S.run?.ctl?.abort(); break;
    case "art-filter": S.ui.artFilter = t.dataset.v; render(); break;
    case "open-art": S.ui.selArt = id; if (S.view !== "approvals") { S.ui.artFilter = S.data.decisions[id] ? S.data.decisions[id].status : "waiting"; location.hash = "approvals"; } else render(); setTimeout(() => document.getElementById("art-detail")?.scrollIntoView({ block: "start" }), 0); break;
    case "close-art": S.ui.selArt = null; render(); break;
    case "copy": {
      const a = S.data.queue.find((x) => x._id === id);
      copy(t.dataset.lang === "ar" ? a?.renderedAr : a?.renderedEn, t.closest(".panel")?.querySelector(".doc"));
      break;
    }
    case "copy-text": copy(t.dataset.text, t.previousElementSibling); break;
    case "add-evidence": S.ui.addEvidence = true; render(); break;
    case "close-evidence": S.ui.addEvidence = false; render(); break;
    case "ev-more": (S.drafts.ev ??= {}).rows = String(Number(dv("ev", "rows", "2")) + 1); render(); break;
    case "ev-approve": {
      const d = S.data.evidence_drafts.find((x) => x._id === id);
      if (!d) break;
      const { _id, ...body } = d;
      if (await put("evidence", id, { ...body, status: "approved", approved_by: S.me.id, approved_at: new Date().toISOString() })) {
        try { await S.db.collection("evidence_drafts").doc(id).delete(); } catch {}
        toast("Approved. Agents can use it now.");
      }
      break;
    }
    case "ev-discard": try { await S.db.collection("evidence_drafts").doc(id).delete(); toast("Discarded."); } catch (err) { toast(`Not discarded. ${errorCopy(err)}`); } break;
    case "ev-withdraw": if (await patch("evidence", id, { status: "withdrawn", withdrawn_by: S.me.id, withdrawn_at: new Date().toISOString() })) toast("Withdrawn. No agent will use it."); break;
    case "ev-tender": { const ev = S.data.evidence.find((x) => x._id === id); if (await patch("evidence", id, { permitted_uses: [...new Set([...(ev.permitted_uses ?? []), "name_client:tender"])] })) toast("The client may now be named in tenders."); break; }
    case "add-unit": S.ui.addUnit = true; render(); break;
    case "close-unit-form": S.ui.addUnit = false; render(); break;
    case "open-unit": if (S.ui.selUnit !== id) S.drafts.unitact = {}; S.ui.selUnit = id; render(); break;
    case "close-unit": S.ui.selUnit = null; render(); break;
    case "renewals": await createRenewals(); break;
    case "entity-approve": await approveEntity(); break;
    case "entity-edit": S.ui.editEntity = !S.ui.editEntity; S.drafts.entity = {}; render(); break;
    case "remove-examples":
      if (!S.ui.confirmRemove || Date.now() - S.ui.confirmRemove > 6000) {
        S.ui.confirmRemove = Date.now(); render();
        setTimeout(() => { S.ui.confirmRemove = 0; schedule(); }, 6000);
        break;
      }
      S.ui.confirmRemove = 0;
      await removeExamples();
      break;
  }
});

async function copy(text, el) {
  if (!text) return;
  try { await navigator.clipboard.writeText(text); toast("Copied."); }
  catch {
    // Some app views refuse the clipboard: select the text instead, so one keystroke copies it.
    if (el) { const sel = window.getSelection(); const r = document.createRange(); r.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(r); }
    toast(el ? "Selected. Press Ctrl+C (⌘C on a Mac) to copy." : "Copying isn't allowed here: select the text and copy it.");
  }
}

document.addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const v = (k) => (fd.get(k) ?? "").toString().trim();
  const name = form.dataset.form;
  const err = (msg) => { const el = form.querySelector(".form-error"); if (el) el.textContent = msg; else toast(msg); };
  const now = new Date();
  try {
    if (name === "acct") {
      const rank = v("priority_rank");
      const acc = Q.AccountInput.parse({ name_en: v("name_en"), ...(v("name_ar") ? { name_ar: v("name_ar") } : {}), type: v("type"),
        ...(v("sector") ? { sector: v("sector") } : {}), relationship_owner: "asil", ...(rank ? { priority_rank: Number(rank) } : {}) });
      const id = newId("ACC");
      if (await put("accounts", id, { ...acc, created_by: S.me.id, created_at: now.toISOString() })) { S.drafts.acct = {}; S.ui.newAccount = false; toast("Account added."); }
    } else if (name === "newopp") {
      const motion = v("motion");
      const lo = v("lo") ? Math.round(Number(v("lo")) * 1e6) : null, hi = v("hi") ? Math.round(Number(v("hi")) * 1e6) : lo;
      const o = Q.newOpportunity({
        id: newId("OPP"), motion, title: v("title"), account_id: v("account_id") || null, route: v("route"), qottuf_role: motion === "contracting" ? v("qottuf_role") : "supplier_installer",
        sector: motion === "contracting" ? v("sector") || null : null, service_lines: fd.getAll("lines").map(String), stage: motion === "contracting" ? v("stage") : "new", owner: "asil",
        next_step: { action: v("action"), owner: v("owner"), due_at: fromLocal(v("due")) }, value_min_sar: lo, value_max_sar: hi, value_source: lo != null ? "estimate" : "unknown",
        dates: v("deadline") ? { submission_deadline: fromLocal(v("deadline")) } : {},
      }, { now, by: S.me.id, rulesVersion: S.rulesVersion });
      if (await put("opps", o.id, o)) { S.drafts.newopp = {}; S.ui.newOpp = false; S.ui.selOpp = o.id; toast("Added."); }
    } else if (name === "nextstep") {
      const o = byId(S.data.opps, form.dataset.id);
      const next = Q.setNextStep(o, { action: v("action"), owner: v("owner"), due_at: fromLocal(v("due")) }, { now, by: S.me.id });
      if (await put("opps", next.id, next)) { S.drafts.nextstep = {}; S.ui.open.nextstep = false; toast("Next step saved."); }
    } else if (name === "move") {
      const o = byId(S.data.opps, form.dataset.id);
      const to = v("to");
      const next = Q.moveOpportunity(o, to, {
        ...(Q.isOpen(to) ? { nextStep: { action: v("action"), owner: v("owner"), due_at: fromLocal(v("due")) } } : {}),
        ...(v("reason") ? { reason: v("reason") } : {}),
        ...(to === "lost" ? { outcome: { primary_reason: v("primary_reason"), ...(v("winner") ? { winner: v("winner") } : {}) } } : {}),
        ...(to === "won" ? { outcome: { value_sar: Number(v("value_sar")) } } : {}),
      }, { now, by: S.me.id, rulesVersion: S.rulesVersion });
      if (await put("opps", next.id, next)) { S.drafts.move = {}; toast(`Moved to ${to.replace("_", " ")}.`); }
    } else if (name === "decide") {
      const o = byId(S.data.opps, form.dataset.id);
      const scores = {};
      let any = false;
      for (const f of S.rules.scorecard.factors) { const s = v(`f-${f.id}`); if (s !== "") { any = true; scores[f.id] = { score: Number(s), ...(v(`e-${f.id}`) ? { evidence: [v(`e-${f.id}`)] } : {}) }; } else scores[f.id] = null; }
      const decision = v("decision");
      const next = Q.decideBid(o, { decision, reason: v("reason"), ...(v("override") ? { override: v("override") } : {}), ...(any ? { scores } : {}),
        ...(decision === "go" ? { nextStep: { action: v("action"), owner: v("owner"), due_at: fromLocal(v("due")) } } : {}) }, { now, by: S.me.id, isOwner: S.me.isOwner, rules: S.rules });
      const d = next.screening.decision;
      // The owner-only record first: if it can't be written, the opportunity isn't moved either.
      if (!(await put("decisions", `bid-${next.id}`, { kind: "bid", opportunity_id: next.id, decision: d.decision, reason: d.reason, override: d.override ?? null,
        score: next.screening.score ?? null, rules_version: S.rulesVersion, by: S.me.id, at: d.at }))) return;
      if (await put("opps", next.id, next)) { S.drafts.decide = {}; toast(decision === "go" ? "Decision recorded: bid." : "Decision recorded: no-bid."); }
    } else if (name.startsWith("agent-")) {
      if (S.sampleState !== "ready") return err("Claude isn't available in this view.");
      if (name === "agent-brief") await startRun("meeting_brief", { account_id: v("account_id"), ...(v("opportunity_id") ? { opportunity_id: v("opportunity_id") } : {}), meeting_at: v("meeting_at"), purpose: v("purpose"), ...(v("notes") ? { notes: v("notes") } : {}) }, (x) => Q.BriefInput.parse(x));
      if (name === "agent-debrief") await startRun("meeting_debrief", { account_id: v("account_id"), ...(v("opportunity_id") ? { opportunity_id: v("opportunity_id") } : {}), notes: v("notes") }, (x) => Q.DebriefInput.parse(x));
      if (name === "agent-case") await startRun("case_study", { project_ref: v("project_ref"), audience: v("audience") }, (x) => Q.CaseStudyInput.parse(x));
      if (name === "agent-bilingual") await startRun("bilingual", { source_lang: v("source_lang"), source_text: v("source_text"), audience: v("audience"), register: v("register"), purpose: v("purpose") }, (x) => Q.BilingualInput.parse(x));
    } else if (name === "decide-art") {
      const status = e.submitter?.value;
      const a = S.data.queue.find((x) => x._id === form.dataset.id);
      if (status === "rejected" && !v("reason")) return err("Give a reason for the rejection, so the next draft can be better.");
      if (status === "approved" && approvalBlocker(a)) return err(approvalBlocker(a));
      if (await put("decisions", a._id, { status, by: S.me.id, at: now.toISOString(), reason: v("reason") || null })) { S.drafts["decide-art"] = {}; toast(status === "approved" ? "Approved. Copy it and use it by hand." : "Rejected."); }
    } else if (name === "ev") {
      const facts = [];
      for (let i = 0; i < Number(dv("ev", "rows", "2")); i++) {
        const n = v(`n${i}`), val = v(`v${i}`);
        if (!n || !val) continue;
        const isNum = /^-?\d+(\.\d+)?$/.test(val.replace(/,/g, "")), isDate = /^\d{4}-\d{2}(-\d{2})?$/.test(val);
        facts.push({ id: `${n}${i}`, kind: isDate ? "date" : isNum ? "figure" : "statement", name: n, value: isNum ? Number(val.replace(/,/g, "")) : val, ...(v(`u${i}`) ? { unit: v(`u${i}`) } : {}), label: `${n.replace(/_/g, " ")}${v("project_ref") ? ", " + v("project_ref") : ""}` });
      }
      const rec = { type: v("type"), tier: v("tier"), title: v("title"), facts, created_by: S.me.id, ...(v("project_ref") ? { project_ref: v("project_ref") } : {}), ...(v("issued_at") ? { issued_at: v("issued_at") } : {}), ...(v("expires_at") ? { expires_at: v("expires_at") } : {}) };
      const parsed = Q.EvidenceInput.parse(rec);
      const id = newId("EV");
      if (await put("evidence_drafts", id, { ...parsed, permitted_uses: v("cert") ? [`certificate:${v("cert")}`] : [], status: "draft", created_at: now.toISOString() })) {
        S.drafts.ev = {}; S.ui.addEvidence = false;
        toast(S.me.isOwner ? "Filed as a draft. Approve it below to let agents use it." : "Filed. Asil approves it before any agent can use it.");
      }
    } else if (name === "unit") {
      const id = newId("UNIT");
      const u = { id, site: v("site"), owner_account_id: null, model: null, manufacturer: null, origin_document: v("origin_document") || null, handed_over_at: v("handed_over_at") || null,
        warranty_ends_at: v("warranty_ends_at") || null, maintenance_contract: null, next_inspection_due: v("next_inspection_due") || null, next_registration_due: null, status: "active",
        source: v("source"), owner_consent_at: null, maintenance_offer: "not_offered", installed_from_opportunity: null, modernisation_candidate: false, created_at: now.toISOString() };
      if (u.site.length < 3) return err("Give the site a name.");
      if (await put("units", id, u)) { S.drafts.unit = {}; S.ui.addUnit = false; toast("Registered."); }
    } else if (name === "unitact") {
      const u = S.data.units.find((x) => x._id === form.dataset.id);
      const fields = { owner_consent_at: v("owner_consent_at") || null, maintenance_offer: v("maintenance_offer"), unverified: false, confirmed_by: S.me.id, confirmed_at: now.toISOString(),
        handed_over_at: v("handed_over_at") || null, warranty_ends_at: v("warranty_ends_at") || null, next_inspection_due: v("next_inspection_due") || null,
        manufacturer: v("manufacturer") || null, origin_document: v("origin_document") || null };
      if (v("inspection_done")) fields.next_inspection_due = Q.addYears(v("inspection_done"), 1);
      if (v("registration_done")) fields.next_registration_due = Q.addYears(v("registration_done"), 1);
      if (v("contract_ends")) {
        if (!v("contract_ref")) return err("Give the contract's reference, so the renewal can be traced to it.");
        fields.maintenance_contract = Q.MaintenanceContract.parse({ contract_ref: v("contract_ref"), tier: u.maintenance_contract?.tier ?? "standard",
          starts_at: u.maintenance_contract?.starts_at ?? today(), ends_at: v("contract_ends") });
        fields.maintenance_offer = "accepted";
      }
      if (await patch("units", u._id, fields)) { S.drafts.unitact = {}; toast("Saved."); }
    } else if (name === "entity") {
      const given = {};
      for (const k of Object.keys(ENTITY_LABEL)) { const val = v(k); if (val) given[k] = k === "founded_year" ? Number(val) : val; }
      const parsed = Q.EntityFields.partial().safeParse(given);
      if (!parsed.success) return err(`Correct: ${[...new Set(parsed.error.issues.map((i) => `${ENTITY_LABEL[i.path[0]] ?? i.path.join(".")} (${i.message})`))].join(", ")}.`);
      const questions = v("questions").split("\n").map((x) => x.trim()).filter(Boolean);
      if (await put("entity", "master", { status: "proposed", fields: parsed.data, questions, proposed_by: S.me.id, proposed_at: now.toISOString() })) {
        S.drafts.entity = {}; S.ui.editEntity = false; toast("Saved. The record stays proposed until you approve it.");
      }
    } else if (name === "sitecheck") {
      const html = v("html");
      if (!html) return;
      const figures = [...Q.rulebookFigures(S.brand), ...Q.figuresFromEvidence(approvedEvidence({ maxTier: "public" }))];
      const ent = S.data.entity?.fields;
      S.ui.siteResult = Q.auditHtml({ url: "https://pasted.page/", html }, { brand: S.brand, figures, ...(ent?.phone_main && ent?.email_main && ent?.website ? { entity: ent } : {}) });
      render();
    } else if (name === "check") {
      const texts = {};
      if (v("en")) texts.en = v("en");
      if (v("ar")) texts.ar = v("ar");
      if (!texts.en && !texts.ar) return;
      const audience = v("audience");
      const figures = [...Q.rulebookFigures(S.brand), ...Q.figuresFromEvidence(approvedEvidence({ maxTier: audience === "public" ? "public" : "tender" }))];
      const r = Q.runTextGates(texts, { rules: S.brand, figures, audience, formal: false, people: people(), publicNumbers: publicNumbers() });
      if (texts.en && texts.ar) {
        for (const f of Q.checkParity(texts.en, texts.ar, S.brand, Q.isStrict(audience))) (f.severity === "fail" ? r.blocking : r.warnings).push({ ...f, lang: f.rule.endsWith("_in_ar") ? "ar" : "en" });
        for (const f of Q.glossarySignals(texts.en, texts.ar, S.brand)) r.warnings.push({ ...f, lang: "ar" });
        r.passed = r.blocking.length === 0;
      }
      S.ui.checkResult = r;
      render();
    }
  } catch (ex) { err(errorCopy(ex)); }
});

async function startRun(kind, input, validate) {
  try { validate(input); } catch (ex) { document.getElementById("agent-error").textContent = errorCopy(ex); return; }
  document.getElementById("agent-error").textContent = "";
  await runAgent(kind, input);
}

async function createRenewals() {
  const cands = Q.renewalCandidates(S.data.units, S.data.opps, today(), S.rules.maintenance.renewal_window_days);
  let n = 0;
  for (const c of cands) {
    try {
      const o = Q.newOpportunity({
        id: newId("OPP"), motion: "elevator", title: `${c.kind === "contract_end" ? "Maintenance renewal" : "Maintenance offer at warranty end"}: ${c.unit.site}`,
        account_id: c.unit.owner_account_id ?? null, route: "maintenance_renewal", qottuf_role: "supplier_installer", stage: "new", owner: "desk_lead", installed_unit_id: c.unit.id ?? c.unit._id,
        dates: { [c.kind === "contract_end" ? "contract_ends" : "warranty_ends"]: c.due },
        next_step: { action: `${c.kind === "contract_end" ? "Renewal offer before the contract ends on" : "Maintenance offer before the warranty ends on"} ${c.due}`, owner: "desk_lead", due_at: new Date(Date.now() + 2 * 86400000).toISOString() },
      }, { now: new Date(), by: S.me.id, rulesVersion: S.rulesVersion });
      if (await put("opps", o.id, o)) n++;
    } catch (e) { toast(errorCopy(e)); }
  }
  toast(n ? `${n} renewal opportunit${n === 1 ? "y" : "ies"} added to the pipeline.` : "Nothing to add.");
}

async function removeExamples() {
  const jobs = [
    ...S.data.opps.filter((o) => o.example).flatMap((o) => [["opps", o._id], ...(S.me.isOwner ? [["decisions", `bid-${o._id}`]] : [])]),
    ...S.data.accounts.filter((a) => a.example).map((a) => ["accounts", a._id]),
    ...S.data.contacts.filter((c) => c.example).map((c) => ["contacts", c._id]),
  ];
  let n = 0;
  for (const [col, id] of jobs) {
    try { await S.db.collection(col).doc(id).delete(); if (col !== "decisions") n++; }
    catch (e) { toast(`Stopped after ${n}: ${errorCopy(e)}`); return; }
  }
  if (S.ui.selOpp && !byId(S.data.opps, S.ui.selOpp)) S.ui.selOpp = null;
  toast(`Removed ${n} example records.`);
}

async function approveEntity() {
  const ent = S.data.entity;
  const el = document.getElementById("entity-error");
  if (ent.questions?.length) { el.textContent = "Settle the open questions first: Edit, then delete each settled question."; return; }
  const parsed = Q.EntityFields.safeParse(ent.fields);
  if (!parsed.success) { el.textContent = `Fill in or correct first: ${[...new Set(parsed.error.issues.map((i) => `${ENTITY_LABEL[i.path[0]] ?? i.path.join(".")}${i.code === "invalid_type" ? "" : ` (${i.message})`}`))].join(", ")}.`; return; }
  const problems = Q.checkAgainstRulebook(parsed.data, S.brand);
  if (problems.length) { el.textContent = problems.join("; "); return; }
  if (await put("entity", "master", { ...ent, _id: undefined, status: "approved", fields: parsed.data, approved_by: S.me.id, approved_at: new Date().toISOString() })) toast("Approved as the master record.");
}

// A republish reaches open views at a quiet moment; carry unsaved drafts and the open panels across it.
function start(saved) {
  const s = saved && typeof saved === "object" ? saved : {};
  if (s.drafts && typeof s.drafts === "object") S.drafts = s.drafts;
  if (s.ui && typeof s.ui === "object") Object.assign(S.ui, s.ui, { siteResult: null, checkResult: null, confirmRemove: 0 });
  boot();
}
try { window.claude?.hot?.snapshot?.(() => clean({ drafts: S.drafts, ui: { ...S.ui, siteResult: null, checkResult: null } })); } catch {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
